<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIVE NG - reCAPTCHA Integration</title>
    <script src="https://www.google.com/recaptcha/enterprise.js?render=6LcKstkrAAAAAMWfR5Ki5eBh1TdCLQD-e7ofMi4S"></script>
</head>
<body>
    <div class="container">
        <h2>ALIVE NG Contact Form</h2>
        <form id="demo-form" action="/submit-contact" method="POST">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            
            <button class="g-recaptcha" 
                    data-sitekey="6LcKstkrAAAAAMWfR5Ki5eBh1TdCLQD-e7ofMi4S" 
                    data-callback='onSubmit' 
                    data-action='submit'>
                Submit
            </button>
        </form>
    </div>

    <script>
        function onSubmit(token) {
            // Add the reCAPTCHA token to the form
            const form = document.getElementById("demo-form");
            const tokenInput = document.createElement("input");
            tokenInput.type = "hidden";
            tokenInput.name = "g-recaptcha-response";
            tokenInput.value = token;
            form.appendChild(tokenInput);
            
            // Submit the form
            form.submit();
        }
        
        // Alternative programmatic approach for Flutter web integration
        function executeRecaptcha(action) {
            return new Promise((resolve, reject) => {
                grecaptcha.enterprise.ready(() => {
                    grecaptcha.enterprise.execute('6LcKstkrAAAAAMWfR5Ki5eBh1TdCLQD-e7ofMi4S', {
                        action: action
                    }).then((token) => {
                        resolve(token);
                    }).catch((error) => {
                        reject(error);
                    });
                });
            });
        }
        
        // Make function available globally for Flutter web
        window.executeRecaptcha = executeRecaptcha;
    </script>

    <style>
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #45a049;
        }
    </style>
</body>
</html>

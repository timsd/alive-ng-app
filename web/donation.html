<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/#/donation">
  <title>Opening Donation - ALIVE-NG</title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    a {
      color: #0f766e;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <h1>Opening secure donation page...</h1>
    <p><a id="donation-link" href="/#/donation">Continue to donations</a></p>
  </main>
  <script>
    (function () {
      var target = '/#/donation';
      try {
        var query = window.location.search || '';
        if (query) {
          target += query;
        }
        document.getElementById('donation-link').setAttribute('href', target);
        window.location.replace(target);
      } catch (_) {
        window.location.href = target;
      }
    })();
  </script>
</body>

</html>

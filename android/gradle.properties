org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false -Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.workers.max=3
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
android.builtInKotlin=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

org.gradle.daemon=true
org.gradle.vfs.watch=true
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

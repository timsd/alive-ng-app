name: Build and publish web image

# Builds the Flutter web bundle off the Oracle instance and pushes it to GHCR.
#
# Why this exists: the instance is 2 OCPU and runs Appwrite, MariaDB, Redis,
# Coolify and nginx. Building the Flutter bundle there saturates the CPU, nginx
# workers stop being scheduled, and the whole instance stops completing TLS
# handshakes -- which is what the 504s and stalled connections were. Building
# in Actions removes that contention entirely rather than mitigating it.
#
# Coolify should then use this image instead of building from source:
#   Application -> Build -> point it at
#   ghcr.io/timsd/alive-ng-app:ghcr-<tag> instead of the Dockerfile build.
#
# NOTE: the FCM provider id is a public identifier, not a secret, so baking it
# into the build args here is safe. It is what lets the client register a push
# target; without it no device can ever receive a notification.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to the commit sha)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="${{ inputs.tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${GITHUB_REF_NAME},ghcr-${GITHUB_REF_NAME},ghcr-${SHORT_SHA}"
          else
            TAGS="ghcr-${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.tags }}
          build-args: |
            FLUTTER_BUILD_ARGS=--dart-define=APPWRITE_FCM_PROVIDER_ID=6a0cbd1600215f960c03
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Actions health check

# Minimal, manual-only workflow whose only job is to prove that GitHub Actions
# can start a job on this repository at all.
#
# Why this exists: the last run of the other workflows reported
#   "no jobs were run" / "run failed at startup"
# which is what GitHub shows when it cannot allocate a runner at all. That
# happens for account-level reasons -- Actions disabled for the repo, no billing
# method, or the spending limit reached -- and not for anything in the workflow
# YAML. This separates the two:
#
#   * this workflow fails too  -> account-level; nothing in the repo will run
#   * this workflow passes     -> the other workflows have their own problem
#
# It runs on demand only, so it costs nothing until it is dispatched.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the runner started
        run: |
          echo "Runner is alive."
          echo "OS: $(uname -srm)"
          echo "Date: $(date -u)"
      - name: Report the commit
        run: echo "SHA: ${{ github.sha }}"

name: Play Store & Web APK Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Store release track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      upload_play_store:
        description: Upload signed AAB to Google Play Store
        required: false
        default: true
        type: boolean
      upload_web_apk:
        description: Upload signed APK to Appwrite app_releases (Web download + OTA)
        required: false
        default: true
        type: boolean

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=android/app/upload-keystore.jks"
          } > android/key.properties

      - name: Provision Firebase & production env files
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PRODUCTION_ENV_JSON_BASE64: ${{ secrets.PRODUCTION_ENV_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          mkdir -p config
          if [ -n "$PRODUCTION_ENV_JSON_BASE64" ]; then
            echo "$PRODUCTION_ENV_JSON_BASE64" | base64 --decode > config/production_env.json
          else
            node scripts/build_android_release.mjs prepare
          fi

      - name: Sync version from pubspec.yaml
        run: node scripts/sync_version_from_pubspec.mjs

      - name: Build signed Play Store AAB
        run: flutter build appbundle --release --no-tree-shake-icons --dart-define-from-file=config/production_env.json

      - name: Build signed Web & OTA APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define-from-file=config/production_env.json

      - name: Upload AAB and APK as downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alive-android-release-${{ github.run_number }}
          retention-days: 14
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to Appwrite app_releases (Web Download & OTA)
        if: ${{ inputs.upload_web_apk }}
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT || 'https://api.alivenigeria.org/v1' }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || '6a3bef53002f5090dedf' }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID || '6a089307002e54291a32' }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "::warning::APPWRITE_API_KEY secret is not set in GitHub Secrets; skipping Appwrite upload. Download app-release.apk from this run's Artifacts or add APPWRITE_API_KEY to repository secrets."
            exit 0
          fi
          node scripts/upload_android_release.mjs

      - name: Upload AAB to Google Play
        if: ${{ inputs.upload_play_store }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: draft

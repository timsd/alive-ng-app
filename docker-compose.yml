services:
  alive_flutter_web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ANDROID_APK_URL: ${ANDROID_APK_URL:-}
        PLAY_STORE_URL: ${PLAY_STORE_URL:-}
        APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-}
        APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-}
        APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID:-}
        APPWRITE_FCM_PROVIDER_ID: ${APPWRITE_FCM_PROVIDER_ID:-}
        LIVEKIT_URL: ${LIVEKIT_URL:-}
        PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
        PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-}
        GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
        WEB_PUSH_CERT_KEY: ${WEB_PUSH_CERT_KEY:-}
        GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
        GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-production}
        GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE:-}
        GLITCHTIP_TRACES_SAMPLE_RATE: ${GLITCHTIP_TRACES_SAMPLE_RATE:-0}
        APPWRITE_RESOURCES_BASE_URL: ${APPWRITE_RESOURCES_BASE_URL:-}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
        FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
        FIREBASE_WEB_AUTH_DOMAIN: ${FIREBASE_WEB_AUTH_DOMAIN:-}
        FIREBASE_WEB_PROJECT_ID: ${FIREBASE_WEB_PROJECT_ID:-}
        FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:-}
        FIREBASE_WEB_MESSAGING_SENDER_ID: ${FIREBASE_WEB_MESSAGING_SENDER_ID:-}
        FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
        FIREBASE_WEB_MEASUREMENT_ID: ${FIREBASE_WEB_MEASUREMENT_ID:-}
        RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    expose:
      - "80"

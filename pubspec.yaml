name: alive_flutter_app
description: A Flutter version of the ALIVE NG Ministry app
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  
  # State Management (using flutter_riverpod as primary)
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^16.2.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  json_annotation: ^4.8.1
  
  # Database & Storage
  supabase_flutter: ^2.10.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  
  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.0.1
  firebase_analytics: ^12.0.1
  firebase_crashlytics: ^5.0.1
  
  # Date & Time
  intl: 0.20.2
  
  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  
  # Notifications
  flutter_local_notifications: ^19.4.1
  
  # Speech & Audio (used in bible game and TTS service)
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  
  # Video Conferencing (used in conference platform)
  jitsi_meet_flutter_sdk: ^11.5.1
  
  # Chat & Messaging (used in chat service)
  stream_chat_flutter: ^9.4.0
  stream_chat_flutter_core: ^9.4.0
  
  # Payment Integration
  pay_with_paystack: ^1.0.7
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  
  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.1.12
  package_info_plus: ^8.3.1
  device_info_plus: ^12.1.0
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  
  # Location & Permissions
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  
  # Connectivity
  connectivity_plus: ^6.1.5
  timeago: ^3.7.1

  # Data models
  equatable: ^2.0.5
  timezone: 0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/certificates/


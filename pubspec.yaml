name: alive_flutter_app
description: A Flutter version of the ALIVE Nigeria Ministry app
version: 2.0.7+15
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  archive: ^4.6.0
  
  # UI Components
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.2.4
  path_parsing: ^1.1.0
  cached_network_image: ^4.0.3
  image: ^4.12.0
  
  # State Management (using flutter_riverpod as primary)
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^18.1.3
  http: ^1.2.0
  json_annotation: ^4.9.0
  
  # Database & Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.5
  # SQLite for the web build. `sqflite` has no web implementation, so without
  # this the Bible reader has no database at all in the browser and the app --
  # which ships as a web app -- opens an empty one.
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.0
  
  # Appwrite backend
  appwrite: ^28.3.0

  # Push notifications & crash reporting via Appwrite + GlitchTip/Sentry
  sentry_flutter: ^10.3.0
  
  # Date & Time
  intl: ^0.20.2
  
  # Authentication & Security
  local_auth: ^3.0.2
  
  # Notifications
  flutter_local_notifications: ^22.3.3
  
  # File Handling
  file_picker: ^13.3.2
  
  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.2.0
  
  # Speech & Audio (used in bible game and TTS service)
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  
  # Video Conferencing
  livekit_client: ^2.11.0
  
  # Payment Integration
  paystack_flutter_sdk: ^0.0.1-alpha.2
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  
  # Utils
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.2
  image_picker: ^1.2.1
  share_plus: ^13.3.1
  in_app_update: ^5.0.0
  web: ^1.1.2
  
  # Permissions
  permission_handler: ^11.4.0
  
  # Time formatting
  timeago: ^3.6.1

  # Email & Web Services
  webview_flutter: ^4.14.1

  # Data models & Media
  equatable: ^3.0.0
  timezone: ^0.11.2
  just_audio: ^0.10.6
  crypto: ^3.0.6
  syncfusion_flutter_pdf: ^35.1.43
  pdfrx: ^2.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dependency_overrides:
  permission_handler_android: 12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  json_serializable: ^6.13.0
  mockito: ^5.8.1
  puppeteer: ^3.16.0

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/series/
    - assets/icons/
    - assets/data/
    # Listed file by file rather than as a directory. With 'assets/bible/'
    # every maintenance script that wrote a bible.db.bak alongside the real
    # database silently bundled it: the web build reached 250 MB, 131 MB of it
    # backup copies that no browser ever reads. Listing the files means a new
    # stray file is excluded by default rather than shipped by accident.
    - assets/bible/bible.db
    - assets/bible/books_en.json
    - assets/bible/books_ha.json
    - assets/bible/books_ig.json
    - assets/bible/books_yo.json



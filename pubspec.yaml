name: alive_flutter_app
description: A Flutter version of the ALIVE-NG Ministry app
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.4.10
  
  # UI Components
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.12.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  
  # State Management (using flutter_riverpod as primary)
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^12.1.3
  
  # HTTP & API
  http: ^1.1.2
  json_annotation: ^4.8.1
  # json_serializable removed from dependencies; kept in dev_dependencies
  
  # Database & Storage
  cloud_firestore: ^6.1.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.8.3
  sqflite_common_ffi: ^2.3.2
  sqlite3: ^2.4.0
  
  # Appwrite backend
  appwrite: ^24.0.0

  # Firebase compatibility while remaining modules migrate to Appwrite
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  firebase_analytics: ^12.0.4
  firebase_crashlytics: ^5.0.4
  cloud_functions: ^6.0.4
  
  # Date & Time
  intl: 0.20.2
  
  # Authentication & Security
  local_auth: ^2.3.0
  google_sign_in: ^6.3.0
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  
  # File Handling
  file_picker: ^10.1.2
  pdf: ^3.10.7
  # printing removed temporarily to resolve native library conflict in Android release
  
  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  
  # Speech & Audio (used in bible game and TTS service)
  speech_to_text: ^7.3.0
  flutter_tts: ^3.8.5
  
  # Video Conferencing
  livekit_client: ^2.7.0
  
  # Payment Integration
  pay_with_paystack: ^1.0.7
  paystack_flutter_sdk: ^0.0.1-alpha.2
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  
  # Utils
  uuid: ^4.2.2
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  device_info_plus: ^12.2.0
  image_picker: ^1.0.7
  share_plus: ^12.0.1
  image_gallery_saver_plus: ^4.0.1
  in_app_update: ^4.2.5
  web: ^1.1.1
  
  # Location & Permissions
  geolocator: ^10.1.1
  geocoding: ^2.1.1
  permission_handler: ^11.4.0
  
  # Connectivity
  connectivity_plus: ^7.1.1
  timeago: ^3.6.1

  # Email & Web Services
  mailer: ^6.6.0
  webview_flutter: ^4.4.4

  # Data models
  equatable: ^2.0.5
  timezone: ^0.10.1
  # supabase_flutter: removed (phasing out Supabase SDK)
  just_audio: ^0.9.46
  crypto: ^3.0.3
  syncfusion_flutter_pdf: ^32.2.9
dependency_overrides:
  record: ^6.1.2
  record_android: ^1.4.5
  record_linux: ^1.2.1
  record_web: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.10.2
  json_serializable: ^6.11.1
  mockito: ^5.6.3
  puppeteer: ^3.16.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/bible/


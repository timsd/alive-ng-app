name: alive_flutter_app
description: A Flutter version of the ALIVE NG Ministry app
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  
  # State Management
  provider: ^6.0.5
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^16.2.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Database & Storage
  supabase_flutter: ^2.10.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8
  
  # Date & Time
  intl: ^0.20.2
  
  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  
  # Notifications
  flutter_local_notifications: ^19.4.1
  
  # Speech & Audio
  speech_to_text: ^6.3.0
  flutter_tts: ^3.8.5
  
  # Video Conferencing
  jitsi_meet_flutter_sdk: ^10.2.0
  
  # Chat & Messaging
  stream_chat_flutter: ^7.2.0
  stream_chat_flutter_core: ^7.2.0
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  
  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.1.12
  package_info_plus: ^8.3.1
  device_info_plus: ^11.5.0
  
  # Location & Permissions
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  
  # Connectivity
  connectivity_plus: ^6.1.5
  timeago: ^3.7.1

  equatable: any
  timezone: any
  # flutter_paystack: ^1.0.5+1  # Temporarily disabled due to dependency conflicts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
  
  # fonts:
  #   - family: Inter
  #     fonts:

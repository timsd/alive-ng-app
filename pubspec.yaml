name: alive_flutter_app
description: A Flutter version of the ALIVE Nigeria Ministry app
version: 2.0.5+11
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  
  # UI Components
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.2.4
  path_parsing: ^1.1.0
  cached_network_image: ^3.4.1
  
  # State Management (using flutter_riverpod as primary)
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^14.0.0
  http: ^1.2.0
  json_annotation: ^4.9.0
  # json_serializable removed from dependencies; kept in dev_dependencies
  
  # Database & Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  # SQLite for the web build. `sqflite` has no web implementation, so without
  # this the Bible reader has no database at all in the browser and the app --
  # which ships as a web app -- opens an empty one.
  sqflite_common_ffi_web: ^1.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # Appwrite backend
  appwrite: ^26.1.0

  # Push notifications & crash reporting via Appwrite + GlitchTip/Sentry
  sentry_flutter: ^9.20.0
  
  # Date & Time
  intl: 0.20.2
  
  # Authentication & Security
  local_auth: ^2.3.0
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  
  # File Handling
  file_picker: ^10.3.10
  pdf: ^3.11.3
  # printing removed temporarily to resolve native library conflict in Android release
  
  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  
  # Speech & Audio (used in bible game and TTS service)
  speech_to_text: ^7.3.0
  flutter_tts: ^3.8.5
  
  # Video Conferencing
  livekit_client: ^2.11.0
  
  # Payment Integration
  pay_with_paystack: ^1.0.14
  paystack_flutter_sdk: ^0.0.1-alpha.2
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  
  # Utils
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  image_picker: ^1.2.1
  share_plus: ^12.0.1
  in_app_update: ^4.2.5
  web: ^1.1.1
  
  # Location & Permissions
  geolocator: ^10.1.1
  permission_handler: ^11.4.0
  
  # Connectivity
  connectivity_plus: ^7.1.1
  timeago: ^3.6.1

  # Email & Web Services
  webview_flutter: ^4.14.1

  # Data models
  equatable: ^2.0.8
  timezone: ^0.10.1
  just_audio: ^0.9.46
  crypto: ^3.0.6
  syncfusion_flutter_pdf: ^32.2.9
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
dependency_overrides:
  record: 6.2.0
  record_android: 1.5.1
  record_linux: 1.3.0
  record_web: 1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  json_serializable: ^6.13.0
  mockito: ^5.6.3
  puppeteer: ^3.16.0

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/bible/



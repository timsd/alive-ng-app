server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Appwrite detects APK archives as ZIP. Normalize download headers here.
    location = /downloads/alive-ng-app.apk {
        resolver 127.0.0.11 valid=300s;
        set $release_host api.alivenigeria.org;
        proxy_pass https://$release_host/v1/storage/buckets/app_releases/files/alive_ng_android_release/download?project=6a3bef53002f5090dedf;
        proxy_set_header Host $release_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $release_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="alive-ng-app.apk"';
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff;
        proxy_buffering off;
    }

    location = /webhooks/paystack {
        resolver 127.0.0.11 valid=300s;
        set $appwrite_host api.alivenigeria.org;
        proxy_pass https://$appwrite_host/v1/functions/paystack_webhook/executions;
        proxy_set_header Host $appwrite_host;
        proxy_set_header Content-Type application/json;
        proxy_set_header X-Appwrite-Project 6a3bef53002f5090dedf;
        proxy_set_header X-Appwrite-Key $http_x_appwrite_key;
        proxy_set_header X-Appwrite-Response-Format 1.7.0;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name $appwrite_host;
    }

    # Android App Links & iOS Universal Links verification
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        try_files $uri =404;
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control 'no-cache' always;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control 'no-cache' always;
    }

    location ~* \.(?:js|mjs|css)$ {
        try_files $uri =404;
        add_header Cache-Control no-cache always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

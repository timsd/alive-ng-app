<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="#607D8B" stroke="#455A64" stroke-width="3"/>
  
  <!-- Open book -->
  <path d="M35 45 Q60 35 85 45 L85 75 Q60 65 35 75 Z" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2"/>
  <line x1="60" y1="35" x2="60" y2="75" stroke="#8D6E63" stroke-width="2"/>
  
  <!-- Book pages -->
  <g stroke="#BCAAA4" stroke-width="1" opacity="0.7">
    <line x1="40" y1="50" x2="55" y2="48"/>
    <line x1="40" y1="55" x2="55" y2="53"/>
    <line x1="40" y1="60" x2="55" y2="58"/>
    <line x1="40" y1="65" x2="55" y2="63"/>
    <line x1="65" y1="48" x2="80" y2="50"/>
    <line x1="65" y1="53" x2="80" y2="55"/>
    <line x1="65" y1="58" x2="80" y2="60"/>
    <line x1="65" y1="63" x2="80" y2="65"/>
  </g>
  
  <!-- Globe/world -->
  <circle cx="60" cy="85" r="12" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  <path d="M50 85 Q55 80 60 85 Q65 90 70 85" fill="#2196F3" opacity="0.7"/>
  <path d="M52 82 Q58 87 64 82" fill="#2196F3" opacity="0.7"/>
  
  <!-- Light/wisdom rays -->
  <g stroke="#FFD54F" stroke-width="2" opacity="0.8">
    <line x1="60" y1="25" x2="60" y2="30"/>
    <line x1="75" y1="30" x2="73" y2="35"/>
    <line x1="85" y1="45" x2="80" y2="47"/>
    <line x1="45" y1="30" x2="47" y2="35"/>
    <line x1="35" y1="45" x2="40" y2="47"/>
  </g>
  
  <!-- Series title -->
  <text x="60" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">GENERAL</text>
</svg>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="#4A90E2" stroke="#2E5C8A" stroke-width="3"/>
  
  <!-- Bible book -->
  <rect x="30" y="35" width="60" height="50" rx="4" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Bible pages -->
  <rect x="32" y="37" width="56" height="46" rx="2" fill="#F5F5DC"/>
  
  <!-- Cross on cover -->
  <rect x="57" y="45" width="6" height="20" fill="#FFD700"/>
  <rect x="50" y="52" width="20" height="6" fill="#FFD700"/>
  
  <!-- Text lines -->
  <line x1="38" y1="50" x2="52" y2="50" stroke="#333" stroke-width="1"/>
  <line x1="38" y1="55" x2="48" y2="55" stroke="#333" stroke-width="1"/>
  <line x1="38" y1="65" x2="52" y2="65" stroke="#333" stroke-width="1"/>
  <line x1="38" y1="70" x2="50" y2="70" stroke="#333" stroke-width="1"/>
  
  <line x1="68" y1="50" x2="82" y2="50" stroke="#333" stroke-width="1"/>
  <line x1="68" y1="55" x2="78" y2="55" stroke="#333" stroke-width="1"/>
  <line x1="68" y1="65" x2="82" y2="65" stroke="#333" stroke-width="1"/>
  <line x1="68" y1="70" x2="80" y2="70" stroke="#333" stroke-width="1"/>
  
  <!-- Series title -->
  <text x="60" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">BIBLE SAYS</text>
</svg>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="#FF9800" stroke="#F57C00" stroke-width="3"/>
  
  <!-- Cross -->
  <rect x="55" y="30" width="10" height="35" rx="2" fill="white"/>
  <rect x="45" y="45" width="30" height="10" rx="2" fill="white"/>
  
  <!-- Heart -->
  <path d="M60 75 C50 65, 35 65, 35 50 C35 40, 45 35, 55 40 C60 35, 65 35, 70 40 C80 35, 90 40, 90 50 C90 65, 75 65, 60 75 Z" fill="#E91E63"/>
  
  <!-- Hands in prayer -->
  <path d="M25 80 Q30 75 35 80 Q30 85 25 80" fill="#FFCC80" stroke="#FF8A65" stroke-width="1"/>
  <path d="M85 80 Q90 75 95 80 Q90 85 85 80" fill="#FFCC80" stroke="#FF8A65" stroke-width="1"/>
  
  <!-- Light rays -->
  <g stroke="white" stroke-width="2" opacity="0.7">
    <line x1="60" y1="20" x2="60" y2="25"/>
    <line x1="75" y1="25" x2="73" y2="30"/>
    <line x1="85" y1="40" x2="80" y2="42"/>
    <line x1="85" y1="60" x2="80" y2="58"/>
    <line x1="75" y1="75" x2="73" y2="70"/>
    <line x1="45" y1="25" x2="47" y2="30"/>
    <line x1="35" y1="40" x2="40" y2="42"/>
    <line x1="35" y1="60" x2="40" y2="58"/>
    <line x1="45" y1="75" x2="47" y2="70"/>
  </g>
  
  <!-- Series title -->
  <text x="60" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">CHRISTIAN LIVING</text>
</svg>